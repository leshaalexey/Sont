[package]
name = "sont-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Демон-оркестратор Sont"

[[bin]]
name = "sontd"
path = "src/main.rs"

[dependencies]
sont-core.workspace = true
sont-ipc.workspace = true
sont-sub.workspace = true
sont-xray.workspace = true

anyhow.workspace = true
reqwest.workspace = true
sha2.workspace = true
thiserror.workspace = true
tun2proxy.workspace = true
futures-util.workspace = true
url.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "process"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Rpc",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
base64.workspace = true
