[package]
name = "sont-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Окно в трее для Sont"

[[bin]]
name = "sont-tray"
path = "src/main.rs"

[dependencies]
sont-core.workspace = true
sont-ipc.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# QR рисует Rust, а не браузер: писать кодировщик на JS ради одной кнопки
# незачем, а ключ подписки и без того не стоит гонять лишний раз.
qrcode = { version = "0.14", default-features = false }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Адрес открытой страницы достаётся через UI Automation, а это COM. У
# `windows-sys` интерфейсы голые, вызов каждого метода — ручная диспетчеризация
# по таблице; `windows` даёт те же биндинги обёрнутыми. Версия уже в дереве как
# зависимость Tauri, так что лишней сборки не добавляет.
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
